<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login | My Webcode</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-container {
            max-width: 450px;
            margin: 3rem auto;
            padding: 2rem;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(15,23,42,.1);
        }

        .login-form {
            display: grid;
            gap: 1.5rem;
        }

        .form-group {
            display: grid;
            gap: 0.5rem;
        }

        .form-group label {
            font-weight: 700;
            color: #312e81;
            font-size: 0.95rem;
        }

        .form-group input {
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.55rem;
            font: inherit;
            font-size: 0.95rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .login-btn {
            padding: 0.9rem 1.5rem;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 0.55rem;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #4338ca;
        }

        .login-btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }

        .form-footer {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
        }

        .form-footer a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 700;
        }

        .error-message {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .page-title {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-title h1 {
            margin: 0 0 0.5rem;
            color: #312e81;
        }

        .page-title p {
            margin: 0;
            color: #64748b;
        }

        .forgot-password {
            text-align: center;
            margin-top: 1rem;
        }

        .forgot-password a {
            color: #4f46e5;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body id="login">
    <header class="site-header">
        <div class="nav page">
            <a class="brand" href="index.html" aria-label="My Webcode home"><span class="logo-mark">&lt;/&gt;</span><span>MY WEBCODE</span></a>
            <nav class="nav-links" aria-label="Main menu">
                <a href="index.html">Home</a>
                <a href="pricing.html">Pricing</a>
                <a href="payment-history.html">Payments</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="login-container">
            <div class="page-title">
                <h1>Customer Login</h1>
                <p>Sign in to your account</p>
            </div>

            <form class="login-form" id="customerSignInForm" data-customer-signin>
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" name="email" required placeholder="you@example.com">
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" name="password" required placeholder="Enter your password">
                    <span class="error-message" id="passwordError"></span>
                </div>

                <button type="submit" class="login-btn">Sign In</button>

                <div class="forgot-password">
                    <a href="#" onclick="showForgotPassword()">Forgot Password?</a>
                </div>

                <div class="form-footer">
                    Don't have an account? <a href="customer-register.html">Create one here</a>
                </div>
            </form>
        </div>
    </main>

    <footer>Copyright 2026 My Webcode</footer>

    <p class="message" data-message role="status"></p>

    <script src="app.js" defer></script>
    <script src="customer-auth.js" defer></script>
</body>
</html>
